name: Offline validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OFFLINE: "1"
      DRY_RUN: "1"
      LLM_PROVIDER: none
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip check
      - run: python evals/run_evals.py
      - run: python -m unittest evals.test_restore evals.test_settings -v
      - run: node evals/test_dashboard.cjs
